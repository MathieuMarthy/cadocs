# cargo-deny: run by .github/workflows/security.yml, and locally with `cargo deny check`.

[graph]
# Every feature, so the S3 build is checked too.
all-features = true

[advisories]
# RustSec: a known vulnerability fails the build. Unmaintained crates are only reported for the
# workspace's direct dependencies, which it can act on.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # SQLite before 3.54.0 can return stale page-cache bytes when it opens a database beside a
    # crafted `-wal` file of another page size. cadocs only opens its own data folder, which an
    # attacker able to plant files there already controls. sqlx 0.9.0, the latest, caps
    # libsqlite3-sys below 0.38, so the patched 0.39 cannot be taken yet: remove this once sqlx
    # allows it (docs/notes/store.md).
    { id = "RUSTSEC-2026-0459", reason = "local only, own files; blocked on sqlx allowing libsqlite3-sys 0.39" },
]

[licenses]
# Compatible with AGPL-3.0 (ADR 0010). A new license must be checked before it is added here.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
# Two versions of a crate cost binary size, so they show, without failing: some come from
# dependencies that have not moved yet (sha2 0.10 and 0.11, through rusty-s3).
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path dependencies, which count as wildcards otherwise.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
