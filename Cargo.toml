[workspace]
resolver = "3"
members = ["crates/*"]
# A plain `cargo build` must not build `cadocs-bench`: its features would unify into the server's
# dependencies and change the binary that ships. `--workspace` still covers it.
default-members = [
    "crates/cadocs-collab",
    "crates/cadocs-core",
    "crates/cadocs-server",
    "crates/cadocs-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
cadocs-collab = { path = "crates/cadocs-collab" }
cadocs-core = { path = "crates/cadocs-core" }
cadocs-store = { path = "crates/cadocs-store" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rust-embed = "8"
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-tungstenite = "0.29"
tower = { version = "0.5", default-features = false, features = ["util"] }
# The version axum uses: `ws.rs` reads its error type, and a second copy would not match.
tungstenite = { version = "0.29", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
yrs = { version = "0.28", features = ["sync"] }

# Tests must see the yrs that ships: its overflow checks and debug assertions only fire in dev
# builds, on crafted frames, and would hide what the release binary does with them.
[profile.dev.package.yrs]
debug-assertions = false
overflow-checks = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
