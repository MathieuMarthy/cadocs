[workspace]
resolver = "3"
members = ["crates/*"]
# A plain `cargo build` must not build `cadocs-bench`: its features would unify into the server's
# dependencies and change the binary that ships. `--workspace` still covers it.
default-members = [
    "crates/cadocs-collab",
    "crates/cadocs-content",
    "crates/cadocs-core",
    "crates/cadocs-files",
    "crates/cadocs-jobs",
    "crates/cadocs-search",
    "crates/cadocs-server",
    "crates/cadocs-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "getrandom", "password-hash"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
bytes = { version = "1", default-features = false }
cadocs-collab = { path = "crates/cadocs-collab" }
cadocs-content = { path = "crates/cadocs-content" }
cadocs-core = { path = "crates/cadocs-core" }
cadocs-files = { path = "crates/cadocs-files" }
cadocs-jobs = { path = "crates/cadocs-jobs" }
cadocs-search = { path = "crates/cadocs-search" }
cadocs-store = { path = "crates/cadocs-store" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4"
percent-encoding = { version = "2", default-features = false, features = ["std"] }
# Markdown import (ADR 0008). No `html` or `getopts`: cadocs renders HTML from its own AST.
pulldown-cmark = { version = "0.13", default-features = false }
rust-embed = "8"
# Snowball stemmers for search (ADR 0007). MIT and BSD-3-Clause.
rust-stemmers = "1.2"
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
subtle = { version = "2", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-tungstenite = "0.29"
tower = { version = "0.5", default-features = false, features = ["util"] }
# The version axum uses: `ws.rs` reads its error type, and a second copy would not match.
tungstenite = { version = "0.29", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
uuid = { version = "1", default-features = false, features = ["std", "v7"] }
yrs = { version = "0.28", features = ["sync"] }
# Revisions, compressed (docs/DATA_MODEL.md#documents). No legacy formats or dictionary builder.
zstd = { version = "0.13", default-features = false }

# Tests must see the yrs that ships: its overflow checks and debug assertions only fire in dev
# builds, on crafted frames, and would hide what the release binary does with them.
[profile.dev.package.yrs]
debug-assertions = false
overflow-checks = false

# Unoptimized, one hash takes seconds and the auth tests take minutes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
