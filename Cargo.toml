[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
cadocs-core = { path = "crates/cadocs-core" }
cadocs-store = { path = "crates/cadocs-store" }
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
