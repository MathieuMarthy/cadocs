# Known vulnerabilities, licenses (ADR 0010), secrets and static analysis. On every pull request and
# weekly, since a new advisory can hit code that did not change. On a push to main, the secrets scan
# and CodeQL, and the advisory checks only for a tree no pull request tested (ADR 0031).
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tested:
    name: Tested as a pull request
    # ci.yml's check, against this workflow's runs: a merge whose tree its pull request's head passed
    # skips cargo-deny and npm-audit (a new advisory waits for the next pull request or Monday). A
    # direct push or a main that moved gets them.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Any failure in the test leaves tested=false, so the checks run.
        run: |
          tested=false
          if head=$(git rev-parse -q --verify 'HEAD^2') \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ] \
            && [ "$(gh run list --commit "$head" --event pull_request --workflow security.yml --status success --limit 1 --json databaseId --jq length)" = 1 ]; then
            tested=true
          fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

  cargo-deny:
    name: Rust advisories, licenses, sources
    needs: tested
    # On a pull request, on schedule or by hand, tested is skipped and the check runs.
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml holds the rules, and the advisory ignored there with its reason.
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check

  npm-audit:
    name: npm advisories
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # High and critical fail the build, except the advisories web/scripts/audit.ts lists with their
      # reason (npm has no ignore flag). Lower ones show in the log.
      - run: npm --prefix web audit || true
      - run: node web/scripts/audit.ts

  secrets:
    name: Secrets in history
    # On main too: the only scan of a direct push before Monday, for 15 seconds.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --no-banner --exit-code 1

  codeql:
    name: CodeQL (${{ matrix.language }})
    # On main too: main's analysis is the alert list, and the base each pull request is compared with.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
