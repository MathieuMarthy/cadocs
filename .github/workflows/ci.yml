# Tests on every pull request. On every push to main, the end-to-end campaign and the image, and the
# tests again only for a tree no pull request tested (ADR 0031).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain the suite was last checked with. Bump it on purpose: new lints can fail clippy.
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "24"

jobs:
  tested:
    name: Tested as a pull request
    # A merge whose tree is its pull request's head, and that head passed CI as a pull request, was
    # tested as is. A main that moved since, or a direct push, gets the tests again.
    # shortcut: a change merged then reverted on main while the pull request was open goes unseen,
    # upgrade to required up-to-date branches if that ever bites.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Any failure in the test leaves tested=false, so the tests run.
        run: |
          tested=false
          if head=$(git rev-parse -q --verify 'HEAD^2') \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ] \
            && [ "$(gh run list --commit "$head" --event pull_request --workflow ci.yml --status success --limit 1 --json databaseId --jq length)" = 1 ]; then
            tested=true
          fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Rust (${{ matrix.name }})
    needs: tested
    # On a pull request or by hand, tested is skipped and the tests run.
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
            minio: ""
          - name: s3
            features: "--features=cadocs-server/s3,cadocs-files/s3"
            # MinIO stopped publishing community images in 2025 (docs/notes/server.md).
            minio: bitnamilegacy/minio:2025.4.22
    services:
      minio:
        # An empty image skips the service, for the default build.
        image: ${{ matrix.minio }}
        ports: ["9000:9000"]
        env:
          MINIO_ROOT_USER: cadocs
          MINIO_ROOT_PASSWORD: cadocs-secret
          MINIO_DEFAULT_BUCKETS: wiki
    env:
      CADOCS_TEST_S3_ENDPOINT: ${{ matrix.minio && 'http://127.0.0.1:9000' || '' }}
      CADOCS_TEST_S3_BUCKET: wiki
      CADOCS_TEST_S3_ACCESS_KEY_ID: cadocs
      CADOCS_TEST_S3_SECRET_ACCESS_KEY: cadocs-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      - name: Wait for the bucket
        if: matrix.minio != ''
        run: |
          for _ in $(seq 1 30); do
            curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/wiki/ | grep -qE '^(200|403)$' && exit 0
            sleep 2
          done
          exit 1
      - name: Dependencies of the flavor
        # A default build has no S3 crate, an s3 build has them (ADR 0020).
        run: scripts/check-build.sh ${{ matrix.name }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
      - name: Tests
        # An unset CADOCS_TEST_S3_ENDPOINT skips the real S3 test; an empty one must too.
        run: |
          [ -n "$CADOCS_TEST_S3_ENDPOINT" ] || unset CADOCS_TEST_S3_ENDPOINT
          cargo test --workspace ${{ matrix.features }}

  web:
    name: Front end
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # Type check, bundle, and the comparison of the editor schema with Rust's.
      - run: npm --prefix web run build

  e2e:
    name: End-to-end
    # The long campaign: after a merge to main, or by hand, once rust and web passed or were skipped.
    if: ${{ github.event_name != 'pull_request' && !failure() && !cancelled() }}
    needs: [rust, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # The binary embeds web/dist, so the front end is built first.
      - run: npm --prefix web run build
      - run: cargo build --release
      # Under 30 MB, and no S3 code in the default binary.
      - run: scripts/check-build.sh default target/release/cadocs
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          retention-days: 14

  image:
    name: Docker image
    # The image as releases build it, then served, backed up and restored.
    if: ${{ github.event_name != 'pull_request' && !failure() && !cancelled() }}
    needs: [rust, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t cadocs .
      - run: scripts/check-image.sh cadocs
